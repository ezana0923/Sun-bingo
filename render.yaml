services:
  - type: web
    name: sunbingo
    runtime: node
    plan: free
    branch: main
    autoDeploy: true
    healthCheckPath: /api/health
    buildCommand: NODE_OPTIONS="--max-old-space-size=384" npm install --legacy-peer-deps --include=dev && NODE_OPTIONS="--max-old-space-size=384" npm run build
    startCommand: node --max-old-space-size=220 server.js
    envVars:
      - key: NODE_VERSION
        value: 22.23.4
      - key: NODE_ENV
        value: production
      - key: SHARED_APP_URL
        value: https://sunbingo.onrender.com
      - key: ADMIN_SECRET_PIN
        value: 7788
      - key: RENDER_DEPLOY_HOOK_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
