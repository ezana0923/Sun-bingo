services:
  - type: web
    name: sun-bingo
    env: node
    plan: free
    buildCommand: npm install --include=dev --legacy-peer-deps && npm run build
    startCommand: npm run start
    healthCheckPath: /api/cron
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.23.4
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: SHARED_APP_URL
        value: https://sun-bingo.onrender.com
      - key: ADMIN_SECRET_PIN
        value: 7788

