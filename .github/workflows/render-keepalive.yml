name: Render Keep-Alive Cron

on:
  schedule:
    # Run every 10 minutes to prevent Render from sleeping
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render App Health & Cron
        run: |
          URL="${{ secrets.RENDER_APP_URL || 'https://sun-bingo.onrender.com' }}"
          echo "Pinging $URL/api/cron ..."
          curl -s -f -m 30 "$URL/api/cron" || echo "Ping completed"
          curl -s -f -m 30 "$URL/api/health" || echo "Health check completed"
          # Also ping live Google Cloud Run environment
          curl -s -f -m 30 "https://ais-pre-5o2vwpcgfgshkft456mpos-198161772381.europe-west2.run.app/api/cron" || echo "Preview ping completed"
